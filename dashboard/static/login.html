<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CANCER</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #030812;
      --card:   rgba(0, 229, 255, 0.03);
      --border: rgba(0, 229, 255, 0.2);
      --accent: #00e5ff;
      --adim:   rgba(0, 229, 255, 0.12);
      --text:   #d1f2fb;
      --muted:  #4a7291;
      --glow:   0 0 15px rgba(0, 229, 255, 0.3);
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.06) 0%, transparent 70%),
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
    }
    .card {
      width: 350px;
      padding: 44px 36px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: center;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 229, 255, 0.05);
      backdrop-filter: blur(10px);
    }
    .card::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 10px;
      margin-bottom: 6px;
      font-family: monospace;
      text-shadow: var(--glow);
    }
    .logo em { color: var(--accent); font-style: normal; }
    .sub {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 12px;
      font-family: monospace;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .key-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .key-input {
      width: 100%;
      padding: 18px 14px;
      background: rgba(0, 229, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--accent);
      font-size: 28px;
      font-weight: 700;
      font-family: monospace;
      text-align: center;
      letter-spacing: 10px;
      text-transform: uppercase;
      outline: none;
      transition: all 0.2s;
      caret-color: var(--accent);
    }
    .key-input::placeholder {
      color: rgba(74, 114, 145, 0.4);
      letter-spacing: 6px;
      font-size: 20px;
    }
    .key-input:focus {
      border-color: var(--accent);
      background: var(--adim);
      box-shadow: var(--glow);
    }
    .err {
      font-size: 11px;
      color: #ff5064;
      font-family: monospace;
      min-height: 18px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #030812;
      font-size: 11px;
      font-weight: 800;
      font-family: monospace;
      letter-spacing: 3px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: var(--glow);
    }
    .btn:hover  { opacity: 0.9; box-shadow: 0 0 20px rgba(0,229,255,0.5); }
    .btn:active { transform: scale(0.98); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-7px); }
      40%,80% { transform: translateX(7px); }
    }
    .shake { animation: shake 0.35s ease; }
    .voice-note {
      font-size: 10px;
      color: var(--muted);
      margin-top: 20px;
      line-height: 1.6;
      text-align: left;
      font-family: monospace;
    }
    .voice-note code {
      background: rgba(0, 229, 255, 0.08);
      color: var(--accent);
      padding: 1px 4px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 9px;
    }
    #reconnecting {
      display: none;
      color: var(--accent);
      font-size: 11px;
      font-family: monospace;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo"><em>C</em>ANCER</div>
    <div class="sub">HUD Remote Access</div>
    <p id="reconnecting">Reestablishing link…</p>
    <p class="hint">Press <strong style="color:var(--text)">Remote Control</strong> in the CANCER app to obtain access code.</p>
    <div class="key-wrap">
      <input class="key-input" id="key" type="text" maxlength="6"
             autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="· · · · · ·">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" onclick="doLogin()">CONNECT</button>
    <p class="voice-note">
      🎤 <strong style="color:var(--text)">Voice link:</strong> open
      <code>chrome://flags</code> on mobile, search
      <code>Insecure origins treated as secure</code>, add your CANCER URL, tap Relaunch.
    </p>
  </div>

  <script>
    // Auto-reconnect via stored device token
    (async function() {
      const devTok = localStorage.getItem('cancer_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        const d = await r.json();
        if (d.ok && d.token) {
          sessionStorage.setItem('cancer_key', d.key);
          sessionStorage.setItem('cancer_token', d.token);
          location.replace('/');
          return;
        }
      } catch (_) {}
      localStorage.removeItem('cancer_device_token');
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    inp.focus();

    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (inp.value.length === 6) doLogin();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const key = inp.value.trim();
      if (key.length < 6) { shake(); return; }
      let data;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: key })
        });
        data = await r.json();
      } catch (e) {
        document.getElementById('err').textContent = 'Connection error';
        shake(); return;
      }
      if (data.ok && data.token) {
        sessionStorage.setItem('cancer_key', key);
        sessionStorage.setItem('cancer_token', data.token);
        location.href = '/';
      } else {
        inp.value = '';
        inp.focus();
        document.getElementById('err').textContent = 'Invalid or expired key';
        shake();
      }
    }

    function shake() {
      const c = document.getElementById('card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }
  </script>
</body>
</html>
